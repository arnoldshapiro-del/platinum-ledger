<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a111f">
<meta name="description" content="Track every Amex Platinum credit: how much, when it expires, what you've used, and what's left.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Platinum">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}</style>
<title>Platinum Credit Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a phone-style app. Five screens (Today, Credits, Calendar, Perks, Wins) behind a fixed bottom tab bar; details open in a slide-up sheet. */
:root{
  --bg:#0a111f; --bg-glow:#16264a; --panel:#131e36; --panel2:#1a2845; --panel3:#22345a;
  --line:#2a3c62; --track:#253656; --ink:#eef2f8; --muted:#9aa8c3; --faint:#6c7b98;
  --brass:#dfa849; --brass-hi:#f6dc96; --brass-lo:#a8792b; --brass-ink:#1b1406; --brass-soft:rgba(223,168,73,.14);
  --urgent:#f28b74; --urgent-soft:rgba(242,139,116,.14);
  --done:#6fcca5; --done-soft:rgba(111,204,165,.14);
  --metal-a:#e9edf3; --metal-b:#aab4c4; --metal-c:#7f8a9c; --metal-ink:#1d2433;
  --scrim:rgba(4,8,16,.66); --nav-bg:rgba(10,17,31,.94);
  --f-display:"Lora",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.5;color:var(--ink);
  background:radial-gradient(1100px 600px at 85% -10%,var(--bg-glow),transparent 60%),radial-gradient(800px 500px at -10% 30%,rgba(223,168,73,.06),transparent 60%),var(--bg);
  background-attachment:fixed;min-height:100%}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button{font-family:var(--f-body);color:var(--ink)}
.ic{flex:0 0 auto;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Shell */
.app{max-width:760px;margin:0 auto;padding-block:18px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brass-hi),var(--brass) 45%,var(--brass-lo));display:grid;place-items:center;color:var(--brass-ink);font-family:var(--f-display);font-weight:700;font-size:20px;box-shadow:0 4px 18px rgba(223,168,73,.25)}
.brand-t{font-family:var(--f-display);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--brass)}
.sync{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:0 4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--done);box-shadow:0 0 0 4px var(--done-soft)}
.dot.warn{background:var(--brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.view{display:flex;flex-direction:column;gap:22px}
.view.anim > *{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.view.anim > *:nth-child(2){animation-delay:.05s}.view.anim > *:nth-child(3){animation-delay:.1s}.view.anim > *:nth-child(4){animation-delay:.15s}.view.anim > *:nth-child(5){animation-delay:.2s}.view.anim > *:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:24px}
.sec-h .sub{font-size:15px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:16px;font-weight:650;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brass)}
.btn.gold{background:linear-gradient(180deg,var(--brass-hi),var(--brass) 55%,var(--brass-lo));border-color:var(--brass);color:var(--brass-ink);box-shadow:0 6px 20px rgba(223,168,73,.22),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.gold:active,.btn:active{transform:translateY(1px) scale(.99)}
.btn.big{min-height:58px;font-size:18px;border-radius:16px;padding:12px 22px}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--urgent);color:var(--urgent)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:650;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.urgent{background:var(--urgent-soft);border-color:var(--urgent);color:var(--urgent)}
.chip.soon{background:var(--brass-soft);border-color:var(--brass);color:var(--brass)}
.chip.done{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.chip.dash{border-style:dashed}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* Today hero */
.hello{display:flex;flex-direction:column;gap:4px}
.hello h1{font-size:clamp(28px,6.4vw,38px)}
.hello .waiting{font-size:17px;color:var(--muted)}
.hello .waiting b{color:var(--brass);font-size:22px;font-weight:800}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:stretch}
.metal{position:relative;aspect-ratio:1.586;max-width:100%;border-radius:20px;overflow:hidden;color:var(--metal-ink);
  background:linear-gradient(125deg,var(--metal-a) 0%,var(--metal-b) 28%,var(--metal-a) 46%,var(--metal-c) 70%,var(--metal-b) 100%);
  box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7);padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between}
.metal::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px);pointer-events:none}
.metal::after{content:"";position:absolute;top:-50%;bottom:-50%;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.metal::after{animation:sheen 5.5s ease-in-out 1s infinite}}
@keyframes sheen{0%{left:-60%}35%{left:130%}100%{left:130%}}
.metal .m-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.metal .m-name{font-family:var(--f-display);font-size:clamp(15px,3.6vw,20px);font-weight:700;letter-spacing:.18em}
.metal .m-sub{font-size:11px;letter-spacing:.16em;font-weight:700;opacity:.7}
.chipgold{width:46px;height:34px;border-radius:7px;background:linear-gradient(135deg,var(--brass-hi),var(--brass) 50%,var(--brass-lo));position:relative;z-index:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.chipgold::before{content:"";position:absolute;inset:8px 6px;border:1px solid rgba(0,0,0,.25);border-radius:4px}
.metal .m-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;position:relative;z-index:1}
.metal .m-holder{font-size:clamp(12px,2.8vw,15px);font-weight:700;letter-spacing:.14em}
.metal .m-val{text-align:right;font-size:11px;letter-spacing:.1em;font-weight:700;opacity:.75}
.metal .m-val b{display:block;font-size:clamp(16px,4vw,22px);letter-spacing:0;opacity:1;font-variant-numeric:tabular-nums}
.feecard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.ringwrap .in b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.ringwrap .in span{font-size:12.5px;color:var(--muted);margin-top:3px}
.ring .arc{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.anim .ring .arc{animation:ringIn 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--off)}}
.feecard p{font-size:14.5px;color:var(--muted)}

/* Do-next cards */
.next{display:flex;flex-direction:column;gap:12px}
.ncard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.ncard.hot{border-color:var(--urgent)}
.nrow{display:flex;gap:14px;align-items:center}
.nicon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--brass-soft);color:var(--brass);flex:0 0 auto}
.ncard.hot .nicon{background:var(--urgent-soft);color:var(--urgent)}
.ntext{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ntext h3{font-size:19px}
.nmeta{font-size:15px;color:var(--muted)}
.namt{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brass)}
.nbtns{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.allclear{text-align:center;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.allclear .big{font-family:var(--f-display);font-size:24px}

/* Setup progress */
.setupcard{display:flex;flex-direction:column;gap:12px}
.bar{height:12px;border-radius:8px;background:var(--track);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--brass-lo),var(--brass),var(--brass-hi))}
.bar > i.done{background:var(--done)}

/* Stat strip */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .t{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13.5px;font-weight:600}
.stat .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.g .v{color:var(--brass)}.stat.r .v{color:var(--urgent)}.stat.gr .v{color:var(--done)}

/* Tip */
.tip{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,rgba(223,168,73,.12),transparent 70%),var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.tip .tic{width:42px;height:42px;border-radius:12px;background:var(--brass);color:var(--brass-ink);display:grid;place-items:center;flex:0 0 auto}
.tip p{font-size:16px}
.tip .tl{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700;display:block;margin-bottom:2px}

/* Badges row */
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.medal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.medal .disc{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--panel3);color:var(--faint);border:2px dashed var(--line)}
.medal.on .disc{background:radial-gradient(circle at 35% 30%,var(--brass-hi),var(--brass) 55%,var(--brass-lo));color:var(--brass-ink);border:2px solid var(--brass-hi);box-shadow:0 0 0 5px var(--brass-soft),0 8px 24px rgba(223,168,73,.3)}
.medal h4{font-size:15.5px}
.medal p{font-size:13px;color:var(--muted)}
.medal.off h4{color:var(--muted)}

/* Credits grid */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-left:-2px}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:0 0 auto;min-height:42px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:15px;font-weight:600;cursor:pointer;color:var(--muted)}
.fbtn[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.tile:hover{border-color:var(--brass);transform:translateY(-2px)}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .2s,border-color .2s}}
.tile.full{background:linear-gradient(180deg,rgba(111,204,165,.08),transparent 60%),var(--panel)}
.tile.skip{opacity:.55}
.tile-top{display:flex;gap:12px;align-items:center}
.tile-top .ringwrap .in b{font-size:16px}
.tile h3{font-size:17px}
.tile .win{font-size:14px;color:var(--muted)}
.tile .ticon{position:absolute;inset:0;display:grid;place-items:center;color:var(--brass)}
.tile-act{display:flex;gap:8px;flex-wrap:wrap}
.groupt{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;margin-top:8px}
.groupt h3{font-size:20px}
.groupt span{font-size:14.5px;color:var(--muted)}

/* Calendar */
.yearsw{display:flex;gap:8px}
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mon{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mon.now{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.mon.pre{opacity:.45}
.mon-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mon-h h4{font-size:17px}
.mon-h span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mon ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.mon li{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.mon li .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mon li .amt{font-variant-numeric:tabular-nums;color:var(--muted)}
.pip{width:9px;height:9px;border-radius:3px;flex:0 0 auto;background:var(--faint)}
.pip.done{background:var(--done)}.pip.lost{background:var(--urgent)}.pip.open{background:var(--brass)}.pip.future{background:transparent;border:1.5px solid var(--muted)}.pip.pre{background:var(--panel3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dates{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dates li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.dates li:first-child{border-top:0}
.datebox{width:56px;border-radius:12px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--panel2)}
.datebox i{display:block;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.1em;background:var(--brass);color:var(--brass-ink);padding:2px 0}
.datebox b{display:block;font-size:22px;padding:2px 0;font-variant-numeric:tabular-nums}
.dates .dt{display:flex;flex-direction:column;gap:2px;min-width:0}
.dates .dt span{font-size:14px;color:var(--muted)}

/* Perks */
.pgrid{display:flex;flex-direction:column;gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;gap:12px;align-items:center}
.ph .pi{width:46px;height:46px;border-radius:14px;background:var(--brass-soft);color:var(--brass);display:grid;place-items:center;flex:0 0 auto}
.ph h3{font-size:20px}
.ph p{font-size:14.5px;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:15.5px}
.plist li:first-child{border-top:0}
.plist li > div{min-width:0}
.plist b{font-weight:650}
.plist .r{color:var(--brass);font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.plist .s{display:block;color:var(--muted);font-size:14px}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:var(--urgent-soft);border:1px solid var(--urgent);border-radius:14px;padding:12px 14px;font-size:15px}
.warnbox .ic{color:var(--urgent);margin-top:2px}
.counter{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pips i{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);background:var(--panel2)}
.pips i.on{background:var(--brass);border-color:var(--brass)}
.lbtns{display:flex;gap:8px;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);min-width:0}
.field input{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0;min-height:48px}
.bonusrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bonusrow .bt{flex:1 1 220px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bonusrow .bt b{font-size:22px;color:var(--brass);font-variant-numeric:tabular-nums}
.partners{display:flex;gap:6px;flex-wrap:wrap}
.partners span{font-size:14px;padding:5px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.tg{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15.5px}
.tg input{width:24px;height:24px;margin:1px 0 0;accent-color:var(--brass);flex:0 0 auto;cursor:pointer}
.tg .x{text-decoration:line-through;color:var(--muted)}

/* Wins */
.bigsave{text-align:center;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;background:radial-gradient(400px 200px at 50% 0%,rgba(223,168,73,.2),transparent 70%),var(--panel);border:1px solid var(--line);border-radius:22px}
.bigsave .v{font-size:clamp(44px,12vw,64px);font-weight:800;color:var(--brass);font-variant-numeric:tabular-nums;line-height:1.05;background:linear-gradient(180deg,var(--brass-hi),var(--brass) 60%,var(--brass-lo));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.feed li{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.feed .fi{width:38px;height:38px;border-radius:11px;background:var(--brass-soft);color:var(--brass);display:grid;place-items:center;flex:0 0 auto}
.feed .ft{flex:1;min-width:0;display:flex;flex-direction:column}
.feed .ft span{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.feed .fa{font-weight:800;color:var(--done);font-variant-numeric:tabular-nums}
.mhead{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}

/* Bottom nav */

.nav button[aria-current="page"]{color:var(--brass)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brass)}
.nav button:focus-visible{outline:2px solid var(--brass);outline-offset:-4px;border-radius:10px}
.nav .badge{position:absolute;top:6px;left:56%;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--urgent);color:var(--bg);font-size:11px;font-weight:800;display:grid;place-items:center}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:640px;margin:0 auto;max-height:92%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .38s cubic-bezier(.2,.9,.2,1)}.scrim{animation:fade .3s}}
@keyframes up{from{transform:translateY(40%);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.sh-hero .ringwrap .in b{font-size:24px}
.sh-hero .info{flex:1 1 200px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sh-hero h2{font-size:24px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:6px}
.sec .lab{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec p{font-size:16px;max-width:62ch}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:8px 12px;font-size:15px}
.hist li span{min-width:0;overflow-wrap:anywhere}
.celebrate{text-align:center;align-items:center}
.celebrate .medal{border:0;background:transparent;padding:6px}
.celebrate .medal .disc{width:110px;height:110px}

/* Toast */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;width:max-content;max-width:calc(100% - 32px);

@media (prefers-reduced-motion:no-preference){.toast{animation:drop .4s cubic-bezier(.2,.9,.2,1)}}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast .ta{color:var(--done);font-variant-numeric:tabular-nums}

@media (max-width:620px){
  .hero{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .months{grid-template-columns:repeat(2,minmax(0,1fr))}

}

  .nbtns{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  if(b.cad === "month"){ s = new Date(y,m,1); e = new Date(y,m+1,0); }

  return {s:iso(s), e:iso(e), amt:amtFor(b, s.getMonth())};

  if(b.cad === "4yr"){ const g = geStatus(); return {p:g, used:g.used?b.amt:0, left:g.used?0:b.amt, days:null, open:!g.used, pct:g.used?1:0}; }
  const p = periodAt(b, today()); const used = usedIn(b, p);
  return {p, used, left:Math.max(0, p.amt - used), days:daysBetween(tIso(), p.e), pct:p.amt ? used/p.amt : 0};
}
function yearTotals(y){
  const t = tIso(); let used = 0, lost = 0, now = 0, possible = 0;
  for(const b of BENEFITS){
    if(b.cad === "4yr"){ for(const x of entriesFor("ge")) if(x.date.slice(0,4) === String(y)) used += Math.min(b.amt, Number(x.amt)||0); continue; }
    for(const p of periodsInYear(b, y)){
      if(p.e < state.cardSince) continue;
      const u = usedIn(b, p);
      if(state.skip[b.k] && u === 0) continue;
      possible += p.amt;
      if(p.s > t) continue;
      used += u;
      if(p.e < t) lost += (p.amt - u); else now += (p.amt - u);
    }
  }
  return {used, lost, now, possible};
}
function sinceYear(){ return parse(state.cardSince).getFullYear(); }

  const list = MONTHLY.filter(b => !state.skip[b.k]); if(!list.length) return false;

}
function streak(){
  const t = today(); let y = t.getFullYear(), m = t.getMonth(), n = 0;

    if(!monthSwept(y,m)) break; n++; m--; if(m < 0){ m = 11; y--; }
    if(n > 240) break;
  }
  return n;
}

}

let actx = null;
function tone(freq, start, dur, vol, type){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, actx.currentTime + start);
  g.gain.exponentialRampToValueAtTime(vol, actx.currentTime + start + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + start + dur);
  o.connect(g).connect(actx.destination); o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur + 0.05);
}
function chime(level){

    else if(level === "mid"){ [659.25,880,1174.66].forEach((f,i) => tone(f, i*0.08, 0.45, 0.15, "triangle")); }

/* ---------------- saving ---------------- */
let dbRef = null, writing = Promise.resolve(), saveTimer = null, dirty = false, gotFirst = false;
function setStatus(kind, text){ document.getElementById("sync-dot").className = "dot"+(kind==="ok"?" ok":kind==="warn"?" warn":""); document.getElementById("sync-text").textContent = text; }
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  if(!dbRef) return;
  dirty = true; clearTimeout(saveTimer); setStatus("warn","Saving…");
  saveTimer = setTimeout(() => {
    const snap = JSON.parse(JSON.stringify(state));
    writing = writing.then(() => dbRef.set(snap)).then(() => { dirty = false; setStatus("ok","Synced"); })
      .catch(() => { dirty = false; setStatus("warn","This device only"); });
  }, 500);
}
function commit(){ persist(); render(false); }
function hasContent(s){ return s.entries.length || s.lounges.length || Object.keys(s.enrolled).length || Object.keys(s.auto).length || Object.keys(s.setup).length || s.bonus.spent; }
async function connect(){
  const c = window.claude;
  if(!c || typeof c.use !== "function"){ setStatus("ok","Saved on this device"); return; }
  let db = null, user = null;
  try{ const r = await Promise.all([c.use("db"), c.use("user")]); db = r[0]; user = r[1]; }catch(e){}
  if(!db || !user){ setStatus("warn","This device only"); return; }
  const id = await user.id();
  if(!id){ setStatus("warn","This device only"); return; }
  dbRef = db.doc("data/users/" + id + "/ledger");
  dbRef.onSnapshot(snap => {
    if(snap.metadata.hasPendingWrites || dirty) return;
    if(snap.exists){
      const incoming = hydrate(JSON.parse(JSON.stringify(snap.data())));
      if(JSON.stringify(incoming) !== JSON.stringify(state)){
        state = incoming;
        for(const bk of unlocked()) if(!state.badges.includes(bk)) state.badges.push(bk);
        try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
        render(false);
      }
      setStatus("ok","Synced");
    } else if(!gotFirst){
      if(hasContent(state)) persist(); else setStatus("ok","Synced");
    }
    gotFirst = true;
  }, () => { dbRef = null; setStatus("warn","This device only"); });
}

/* ---------------- actions ---------------- */
function checkBadges(){
  const now = unlocked(), fresh = now.filter(k => !state.badges.includes(k));
  if(fresh.length){ state.badges = state.badges.concat(fresh); return fresh; }
  return [];
}
function afterWin(level, srcEl, amt, label, undoId){
  const fresh = checkBadges();
  commit();
  const o = originOf(srcEl);
  if(fresh.length){
    chime("big"); buzz([30,40,60]); boom("big", 0.5, 0.45);
    setTimeout(() => openSheet({kind:"badge", keys:fresh}), 350);
  } else { chime(level); buzz(level === "mid" ? [20,30,40] : 25); boom(level, o.x, o.y); }
  if(amt !== undefined) toast('<span>'+icon("coin",20)+'</span><span><span class="ta">+'+money(amt)+'</span> back in your pocket'+(label ? ' · '+esc(label) : '')+'</span>', undoId);
}
function logEntry(k, amt, date, note, srcEl){
  const b = BK[k]; const before = current(b);
  const id = uid(); state.entries.push({id, b:k, amt:Math.round(amt*100)/100, date, note:note||""});
  const after = current(b);
  const completed = before.left > 0 && after.left <= 0;
  afterWin(completed ? "mid" : "small", srcEl, amt, b.short, id);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, k = el.dataset.k;
  if(act === "tab"){ if(ui.sheet) closeSheet(); go(el.dataset.tab); }
  else if(act === "open"){ if(e.target.closest("button") && e.target.closest("button") !== el) return; openSheet({kind:"credit", k}); }
  else if(act === "close"){ closeSheet(); }
  else if(act === "usefull"){
    e.stopPropagation();
    const b = BK[k], c = current(b), amt = c.open ? b.amt : c.left;
    if(amt <= 0) return;
    logEntry(k, amt, tIso(), "Used in full", el);
  }
  else if(act === "quick"){ const inp = document.getElementById("amt-"+k); if(inp){ inp.value = el.dataset.v; inp.focus(); } }
  else if(act === "del"){ state.entries = state.entries.filter(x => x.id !== el.dataset.id); commit(); toast('<span>Entry removed</span>'); }
  else if(act === "undo"){ state.entries = state.entries.filter(x => x.id !== el.dataset.id); state.lounges = state.lounges.filter(x => x.id !== el.dataset.id); commit(); document.getElementById("toast-root").innerHTML = ""; }
  else if(act === "filter"){ ui.filter = el.dataset.f; render(true); }
  else if(act === "year"){ ui.calYear = Number(el.dataset.y); render(true); }
  else if(act === "lounge"){
    const id = uid(); state.lounges.push({id, k:el.dataset.l, date:tIso()});
    const l = LOUNGES.find(x => x.k === el.dataset.l);
    const fresh = checkBadges(); commit();
    chime("small"); buzz(25); const o = originOf(el); boom("small", o.x, o.y);
    toast('<span>'+icon("sofa",20)+'</span><span>Visit logged: '+esc(l.n)+'</span>', id);
    if(fresh.length){ chime("big"); boom("big"); setTimeout(() => openSheet({kind:"badge", keys:fresh}), 350); }
  }
  else if(act === "dellounge"){ state.lounges = state.lounges.filter(x => x.id !== el.dataset.id); commit(); }
  else if(act === "sound"){ state.sound = !state.sound; commit(); if(state.sound) chime("small"); }
  else if(act === "reset1"){ ui.resetArmed = true; render(false); }
  else if(act === "reset0"){ ui.resetArmed = false; render(false); }
  else if(act === "reset2"){ const since = state.cardSince, snd = state.sound; state = defaults(); state.cardSince = since; state.sound = snd; ui.resetArmed = false; ui.prev = {}; commit(); toast("<span>Everything erased. Fresh start.</span>"); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && ui.sheet){ closeSheet(); return; }
  const t = e.target.closest && e.target.closest('.tile[data-act="open"]');
  if(t && (e.key === "Enter" || e.key === " ") && e.target === t){ e.preventDefault(); openSheet({kind:"credit", k:t.dataset.k}); }
});
document.addEventListener("change", e => {
  const el = e.target, act = el.dataset.act, k = el.dataset.k;
  if(el.id === "card-since"){ if(el.value){ state.cardSince = el.value; commit(); } return; }
  if(el.dataset.bonus){
    const f = el.dataset.bonus;
    if(f === "deadline"){ if(el.value) state.bonus.deadline = el.value; }
    else { const v = parseFloat(el.value); state.bonus[f] = isFinite(v) && v >= 0 ? v : 0; }
    const was = state.badges.includes("bonus");
    const fresh = checkBadges(); commit();
    if(f === "spent" && fresh.length){ chime("big"); boom("big"); setTimeout(() => openSheet({kind:"badge", keys:fresh}), 350); }
    else if(f === "spent" && !was){ chime("small"); }
    return;
  }
  if(act === "setup"){
    if(el.checked) state.setup[k] = true; else delete state.setup[k];
    if(el.checked){ afterWin("small", el); } else commit();
  }
  else if(act === "enroll"){ if(el.checked) state.enrolled[k] = true; else delete state.enrolled[k]; if(el.checked) afterWin("small", el); else commit(); }
  else if(act === "auto"){
    if(el.checked){ state.auto[k] = tIso(); afterWin("mid", el, current(BK[k]).p.amt, BK[k].short + " on autopilot"); }
    else { delete state.auto[k]; commit(); }
  }
  else if(act === "skip"){ if(el.checked) state.skip[k] = true; else delete state.skip[k]; commit(); }
  else if(act === "soundbox"){ state.sound = el.checked; commit(); if(state.sound) chime("small"); }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if(!f) return;
  e.preventDefault();
  const k = f.dataset.form;
  const amt = parseFloat(document.getElementById("amt-"+k).value);
  const date = document.getElementById("date-"+k).value;
  const note = document.getElementById("note-"+k).value.trim();
  if(!(amt > 0) || !date) return;
  logEntry(k, amt, date, note, f.querySelector("button[type=submit]"));
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if(h && h !== ui.tab) go(h); });

/* ---------------- start ---------------- */
// Badges already earned before this version: mark them seen quietly so nobody gets a flood of pop-ups.
(function(){ const now = unlocked(); for(const k of now) if(!state.badges.includes(k)) state.badges.push(k); })();
const startTab = (location.hash || "").slice(1);
ui.tab = TABS.some(t => t[0] === startTab) ? startTab : "today";
render(true);
connect();
setInterval(() => render(false), 60*60*1000);
})();
</script>

<script>
if("serviceWorker" in navigator){ window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {})); }
</script>
